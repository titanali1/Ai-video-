name: Build Deisa Android APK

on:
  push:
    branches:
      - 'arena/01a0ea0f-ai-video'
    paths:
      - 'android/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android 35 platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: ./android/build-apk.sh

      - name: Package APK and installation notes
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Deisa-1.0.0-debug.apk
          cat > release/INSTALL.txt <<'EOF'
          Deisa Android debug APK (signed with the standard debug key).

          Minimum Android version: Android 5.0 (API 21).
          On Xiaomi MIUI/HyperOS, if prompted, allow “Install unknown apps” for the app used to open this ZIP/APK. Only install APKs from a trusted source.
          EOF
          cd release
          zip -9 Deisa-Android-APK.zip Deisa-1.0.0-debug.apk INSTALL.txt

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Deisa-Android-APK
          path: release/Deisa-Android-APK.zip
          if-no-files-found: error
          retention-days: 30

      - name: Place requested ZIP in the build branch
        run: |
          cp release/Deisa-Android-APK.zip Deisa-Android-APK.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Deisa-Android-APK.zip
          if git diff --cached --quiet; then
            echo "The APK ZIP is already current."
            exit 0
          fi
          git commit -m "Add Deisa Android APK ZIP"
          git push origin "HEAD:${GITHUB_REF}"
